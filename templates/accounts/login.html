<!doctype html>
<html>
  <head>
    <title>login</title>
  </head>
  <body>
    <h2>login</h2>

    {% if form.errors %}
      <p>invalid username or password</p>
    {% endif %}

    {% if messages %}
      {% for message in messages %}
        <p>{{ message }}</p>
      {% endfor %}
    {% endif %}

    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">login</button>
    </form>

    <p>no account yet? <a href="{% url 'register' %}">register here</a></p>
  </body>
</html>
